name: Run Skill and Send to Telegram

on:
  schedule:
    # 每天早上 9:00 HKT = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-skill:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Check host tools
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($cmd in @('docker', 'ffmpeg', 'python')) {
            if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
              throw "$cmd is required on PATH for this self-hosted runner"
            }
            Write-Host "Found $cmd"
          }

      - name: Check Docker Desktop and Ollama API
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_CONTAINER: ${{ vars.OLLAMA_CONTAINER || 'ollama' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker info | Out-Null
          Write-Host "Docker is available"

          try {
            $tags = Invoke-RestMethod -Uri "$env:OLLAMA_HOST/api/tags" -Method Get -TimeoutSec 10
          } catch {
            throw "Ollama API is not reachable at $env:OLLAMA_HOST. Is the Docker container running with -p 11434:11434? $_"
          }
          Write-Host "Ollama API is healthy"

          $names = @()
          if ($tags.models) {
            $names = @($tags.models | ForEach-Object { $_.name })
          }
          Write-Host ("Installed models: " + (($names -join ', ') -replace '^$', '(none)'))

          $wanted = $env:OLLAMA_MODEL
          $have = $names | Where-Object {
            $_ -eq $wanted -or $_ -like "$wanted`:*" -or ($_ -split ':')[0] -eq ($wanted -split ':')[0]
          }
          if (-not $have) {
            Write-Host "Pulling model $wanted via HTTP /api/pull ..."
            $body = @{ name = $wanted; stream = $false } | ConvertTo-Json
            try {
              Invoke-RestMethod -Uri "$env:OLLAMA_HOST/api/pull" -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 3600 | Out-Null
            } catch {
              Write-Host "HTTP pull failed; trying docker exec fallback..."
              docker exec $env:OLLAMA_CONTAINER ollama pull $wanted
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to pull model $wanted"
              }
            }
          } else {
            Write-Host "Model already present: $wanted"
          }

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Crawl news
        run: |
          python scripts/crawl_news.py --output news.json

      - name: Generate Cantonese script
        env:
          OPENAI_API_KEY: ollama
          OPENAI_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }}
          OPENAI_BASE_URL: http://127.0.0.1:11434/v1
        run: |
          python scripts/generate_script.py --news news.json --output podcast_script.md

      - name: Synthesize podcast MP3
        run: |
          $ErrorActionPreference = 'Stop'
          $dateUtc = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $podcast = "AI_Daily_Podcast_$dateUtc.mp3"
          python scripts/synthesize_podcast.py --script podcast_script.md --output $podcast
          "PODCAST_FILE=$podcast" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Send podcast to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            throw 'TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are required'
          }
          if (-not (Test-Path $env:PODCAST_FILE)) {
            throw "Podcast file not found: $($env:PODCAST_FILE)"
          }

          $caption = 'AI 日報 Podcast（自動生成）'
          $uri = "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendDocument"
          $response = curl.exe -sS -F "chat_id=$($env:TELEGRAM_CHAT_ID)" -F "document=@$($env:PODCAST_FILE)" -F "caption=$caption" $uri
          Write-Host $response
          if ($response -notmatch '"ok"\s*:\s*true') {
            throw 'Telegram sendDocument failed for podcast'
          }

      - name: Send script markdown to Telegram
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendDocument"
          $response = curl.exe -sS -F "chat_id=$($env:TELEGRAM_CHAT_ID)" -F "document=@podcast_script.md" -F "caption=AI 日報腳本" $uri
          Write-Host $response
          if ($response -notmatch '"ok"\s*:\s*true') {
            throw 'Telegram sendDocument failed for script'
          }
