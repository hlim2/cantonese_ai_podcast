name: Run Skill and Send to Telegram

on:
  schedule:
    # 這裡設定執行的時間（使用 UTC 時間，比香港/台灣慢 8 小時）
    # 例如下面的設定代表每天早上 9:00 (UTC 1:00) 執行
    - cron: '0 1 * * *'
  # 允許你在 GitHub 介面上手動點擊執行測試
  workflow_dispatch:

jobs:
  run-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests
          # 如果你的指令碼有其他套件，可以在這裡安裝，例如：
          # pip install -r requirements.txt

      - name: Generate report
        run: |
          {
            echo "# AI Skill Report"
            echo
            echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '```json'
            python scripts/crawl_news.py
            echo '```'
          } > skill_report.md

      - name: Send MD File to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE_PATH="skill_report.md"
          CAPTION="這是您定時生成的技能報告："
          curl -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@"$FILE_PATH" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
